name: deploy

# The release and the image are cut from the same commit, and the deploy waits
# on the release, so the template list baked into the image is never ahead of
# the tarball a VM downloads. The release is skipped when no VM-side file
# changed.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: alan-ko-playground
  REGION: northamerica-northeast1
  SERVICE: sb-control-plane
  REPOSITORY: sb

jobs:
  # A release is only worth cutting when the files VMs actually download have
  # changed. An app-only push would otherwise publish an identical tarball under
  # a new tag on every commit.
  changes:
    runs-on: ubuntu-latest
    outputs:
      vm_files: ${{ steps.filter.outputs.vm_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # enough to diff against the previous commit

      - id: filter
        run: |
          # Publish when in doubt: a manual run, or a first/shallow commit with
          # no parent to compare against, should not silently skip the release.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "vm_files=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only HEAD^ HEAD | grep -qE '^(templates|scripts)/'; then
            echo "vm_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "vm_files=false" >> "$GITHUB_OUTPUT"
          fi

  publish-templates:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.vm_files == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate every template declares its disk
        run: |
          # Fail the release rather than shipping a template the control plane
          # will reject at runtime.
          fail=0
          for dir in templates/*/; do
            name=$(basename "$dir")
            [ "${name#_}" = "$name" ] || continue
            if [ ! -f "$dir/template.yaml" ]; then
              echo "::error::$name is missing template.yaml"; fail=1; continue
            fi
            grep -q '^\s*sizeGb:' "$dir/template.yaml" || {
              echo "::error::$name: template.yaml has no disk.sizeGb"; fail=1; }
            [ -f "$dir/setup.sh" ] || { echo "::error::$name has no setup.sh"; fail=1; }
          done
          exit $fail

      - name: Syntax-check shell scripts
        run: |
          for f in scripts/* templates/*/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || exit 1
          done

      - name: Package
        run: tar czf sandbox-templates.tar.gz templates/ scripts/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Epoch seconds rather than a run number: the tag then survives the
          # run counter being reset and sorts chronologically on its own.
          TAG="templates-$(date +%s)"

          # --latest keeps releases/latest/download/... resolving, which is the
          # URL burned into every VM's startup script.
          gh release create "$TAG" \
            sandbox-templates.tar.gz \
            --latest \
            --title "$TAG" \
            --notes "Templates and VM scripts from ${{ github.sha }}"

  deploy:
    runs-on: ubuntu-latest
    needs: [changes, publish-templates]
    # publish-templates is skipped on an app-only push, and a skipped dependency
    # would otherwise skip this job too. Still refuses to deploy if the release
    # ran and failed, so the image never gets ahead of the tarball.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.publish-templates.result != 'failure' }}
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      # No JSON service-account key: this repo is public.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          # --timeout=3600 is required: the default 300s would sever the SSE
          # boot-log stream partway through provisioning.
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --service-account="sb-control-plane@$PROJECT_ID.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --iap \
            --timeout=3600 \
            --min-instances=0 \
            --max-instances=2 \
            --set-secrets=TAILSCALE_OAUTH=tailscale-oauth-client:latest \
            --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_ZONE=$REGION-b,TAILNET=${{ vars.TAILNET }}
